name: Build macOS Intel (x86_64)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.47.7'

permissions:
  contents: read

jobs:
  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          architecture: x64
          cache: true

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          flutter --version

      - name: Resolve dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        run: flutter build macos --release

      - name: Verify binary architecture
        run: |
          APP="build/macos/Build/Products/Release/Nyachi.app"
          ls -la "build/macos/Build/Products/Release"
          lipo -info "$APP/Contents/MacOS/Nyachi"
          lipo -info "$APP/Contents/Frameworks/FlutterMacOS.framework/FlutterMacOS" || true

      - name: Package
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | head -1 | cut -d' ' -f2 | tr '+' '_')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cd build/macos/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/out/nyachi-${VERSION}-macos-x64.zip" *.app
          cd "$GITHUB_WORKSPACE"
          ls -lh out
          shasum -a 256 out/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyachi-macos-x64
          path: out/*.zip
          if-no-files-found: error
